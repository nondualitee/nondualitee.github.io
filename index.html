<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Dynamic image gallery for sports projects" />
  <title>Dynamic Image Gallery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 2rem;
      text-align: center;
    }

    h1 {
      color: #2c3e50;
      margin-bottom: 1rem;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
      padding: 1rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .gallery img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      object-fit: cover;
    }

    #loadMore {
      padding: 0.75rem 1.5rem;
      margin: 2rem auto;
      font-size: 1rem;
      background: #2c3e50;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #loadMore:hover {
      background: #1a252f;
    }

    footer {
      margin-top: 3rem;
      font-size: 0.9rem;
      color: #aaa;
    }
  </style>
</head>
<body>
  <h1>Project Gallery</h1>
  <p>Showcasing sports infrastructure projects—click below to explore more.</p>

  <div class="gallery" id="gallery"></div>
  <button id="loadMore">Load More</button>

  <footer>
    © 2025 Your Name. Hosted on GitHub Pages.
  </footer>

  <script>
    const gallery = document.getElementById('gallery');
    const loadMoreBtn = document.getElementById('loadMore');
    let currentIndex = 1;
    const batchSize = 12;
    const maxImages = 100; // change this to however many images you may have

    function loadImages() {
      for (let i = currentIndex; i < currentIndex + batchSize && i <= maxImages; i++) {
        const img = document.createElement('img');
        img.src = `images/${i}.jpg`;
        img.alt = `Project ${i}`;
        img.onerror = function () {
          img.remove(); // remove if image doesn't exist
          if (i === currentIndex + batchSize - 1) {
            loadMoreBtn.style.display = 'none';
          }
        };
        gallery.appendChild(img);
      }
      currentIndex += batchSize;

      if (currentIndex > maxImages) {
        loadMoreBtn.style.display = 'none';
      }
    }

    loadMoreBtn.addEventListener('click', loadImages);
    window.addEventListener('DOMContentLoaded', loadImages);
  </script>
</body>
</html>
